[[example]]
name = "sandbox"
path = "examples/sandbox.rs"

[[example]]
name = "save_file"
path = "examples/save_file.rs"

[dependencies.chrono]
version = "0.4.39"
optional = true

[dependencies.directories]
version = "6.0"

[dependencies.dunce]
version = "1.0.5"

[dependencies.egui]
version = "0.33.0"
default-features = false

[dependencies.image-meta]
version = "0.1.2"
optional = true

[dependencies.indexmap]
version = "2.7.0"
features = ["serde"]
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.sysinfo]
version = "0.37"
features = ["disk"]
default-features = false

[dev-dependencies.eframe]
version = "0.33.0"
features = [
    "glow",
    "persistence",
    "wayland",
    "x11",
]
default-features = false

[dev-dependencies.egui_extras]
version = "0.33"
features = ["all_loaders"]

[dev-dependencies.image]
version = "0.25.5"
features = [
    "bmp",
    "jpeg",
    "gif",
    "png",
    "tiff",
    "rayon",
]

