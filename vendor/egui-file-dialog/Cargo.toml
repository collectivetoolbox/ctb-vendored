[package]
edition = "2021"
name = "egui-file-dialog"
version = "0.12.0"
authors = ["Jannis Teipel <jannistpl@gmail.com>"]
build = false
exclude = [
    "media/",
    "!media/readme/",
    ".github/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "easy-to-use and customizable file dialog for egui"
homepage = "https://github.com/jannistpl/egui-file-dialog"
readme = "README.md"
license = "MIT"
repository = "https://github.com/jannistpl/egui-file-dialog"

[features]
default = [
    "serde",
    "default_fonts",
]
default_fonts = ["egui/default_fonts"]
information_view = [
    "dep:chrono",
    "image-meta",
    "indexmap",
]
serde = ["dep:serde"]

[lib]
name = "egui_file_dialog"
path = "src/lib.rs"

